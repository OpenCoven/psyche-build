[package]
name = "psyche-build-tauri"
version = "0.0.2"
edition = "2021"
# tauri-plugin-macos-fps, which removes WKWebView's 60 Hz cap for direct
# macOS distribution, requires Rust 1.85. CI and release builds remain pinned
# to Rust 1.95.0 in the repository toolchain file and workflows.
rust-version = "1.85"

[lib]
name = "psyche_build_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri-build validates macOSPrivateApi against this entry even though Tauri cfg-gates it off non-macOS targets.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
sysinfo = "0.36.1"
sha2 = "0.10"
base64 = "0.22"
unicode-normalization = "0.1"
getrandom = "0.2"
tempfile = "3"

[target.'cfg(not(target_os = "ios"))'.dependencies]
portable-pty = { path = "vendor/portable-pty", version = "=0.8.1" }

[target.'cfg(target_os = "macos")'.dependencies]
# WKWebView limits requestAnimationFrame to 60 Hz on macOS 13–15 unless its
# private high-refresh preference is explicitly enabled. Psyche Build is
# distributed as notarized DMGs/Homebrew, not through the Mac App Store.
tauri-plugin-macos-fps = "0.1.0"
window-vibrancy = "0.6"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSClickGestureRecognizer", "NSGestureRecognizer", "NSImage", "NSImageRep", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3.2", features = ["block2", "WKNavigation", "WKNavigationDelegate", "WKSnapshotConfiguration", "WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
