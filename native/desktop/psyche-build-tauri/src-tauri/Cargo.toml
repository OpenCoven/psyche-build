[package]
name = "psyche-build-tauri"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"

[lib]
name = "psyche_build_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri-build validates macOSPrivateApi against this entry even though Tauri cfg-gates it off non-macOS targets.
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
sysinfo = "0.36.1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
