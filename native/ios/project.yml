name: Psyche
options:
  bundleIdPrefix: ai.opencoven
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  PsycheCore:
    type: framework
    platform: iOS
    sources:
      - path: PsycheCore/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.psyche-ios.core
        DEFINES_MODULE: YES
  PsycheCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PsycheCore/Tests
    dependencies:
      - target: PsycheCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.psyche-ios.coretests
  PsycheApp:
    type: application
    platform: iOS
    sources:
      - path: PsycheApp/Sources
    info:
      path: PsycheApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Psyche Build
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Psyche uses your local network to discover and connect to your paired coding host.
        NSBonjourServices:
          - _psyche._tcp
        PsycheReleaseCommit: $(PSYCHE_RELEASE_SHA)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: PsycheCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.psyche-ios
        PRODUCT_NAME: Psyche Build
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  PsycheAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PsycheApp/Tests
    dependencies:
      - target: PsycheApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.opencoven.psyche-ios.uitests
        TEST_TARGET_NAME: PsycheApp
schemes:
  PsycheCore:
    build:
      targets:
        PsycheCore: all
        PsycheCoreTests: [test]
    test:
      targets:
        - PsycheCoreTests
  PsycheApp:
    build:
      targets:
        PsycheApp: all
        PsycheAppUITests: [test]
    test:
      targets:
        - PsycheCoreTests
        - PsycheAppUITests
