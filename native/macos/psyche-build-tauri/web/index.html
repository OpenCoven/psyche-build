<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>psyche</title>
    <style id="codemirror-nonce-source"></style>
    <link rel="stylesheet" href="./xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./xterm.js"></script>
    <script src="./xterm-addon-fit.js"></script>
    <script src="./xterm-addon-webgl.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="rail sidebar" id="sidebar" data-tauri-drag-region aria-label="Sessions">
        <div class="sidebar-head">
          <input
            id="session-search"
            class="session-search"
            type="search"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search sessions…"
            aria-label="Search sessions"
          />
          <button id="rail-new-tab" class="rail-btn" title="New session (⌘T)" aria-label="New session">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M8 3.75v8.5M3.75 8h8.5" fill="none" stroke="currentColor"
                    stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="rail-open-project" class="rail-btn" title="Open project (⌘O)" aria-label="Open project">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path d="M2.25 4.4c0-.9.7-1.6 1.6-1.6h2.3l1.3 1.5h4.6c.9 0 1.6.7 1.6 1.6v5.7c0 .9-.7 1.6-1.6 1.6H3.85c-.9 0-1.6-.7-1.6-1.6z"
                    fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="session-list" id="session-list" role="navigation" aria-label="Sessions grouped by project"></div>
        <div class="sidebar-foot">
          <div class="theme-row">
            <select id="theme-select" class="theme-select" aria-label="Theme">
              <option value="coven-purple">Coven Purple</option>
              <option value="claude-orange">Claude Orange</option>
              <option value="codex-blackish">Codex Blackish</option>
              <option value="gemini-blue">Gemini Blue</option>
              <option value="emerald">Emerald</option>
              <option value="rose">Rose</option>
            </select>
            <label class="solid-toggle" title="Opaque background instead of macOS vibrancy">
              <input id="solid-bg" type="checkbox" />
              <span>Solid</span>
            </label>
          </div>
          <label class="bg-opacity-row" for="bg-opacity">
            <span class="bg-opacity-label">Background</span>
            <input
              id="bg-opacity"
              class="bg-opacity-slider"
              type="range"
              min="0.3"
              max="1"
              step="0.05"
              value="1"
              aria-label="Background opacity"
            />
            <span class="bg-opacity-value" id="bg-opacity-value">100%</span>
          </label>
        </div>
      </aside>

      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <span class="brand" data-tauri-drag-region>psyche</span>
          <span class="brand-sub" data-tauri-drag-region>workspace</span>
        </div>
        <div class="titlebar-center" data-tauri-drag-region></div>
        <div class="titlebar-right" data-tauri-drag-region>
          <button
            id="browser-toggle"
            class="chrome-btn"
            data-browser-toggle
            title="Show browser preview (⌘⌥B). Right-click to cycle side."
            aria-pressed="false"
          >
            <svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true">
              <rect x="1.25" y="2.25" width="11.5" height="9.5" rx="1.6"
                    fill="none" stroke="currentColor" stroke-width="1.3"/>
              <line x1="9" y1="2.25" x2="9" y2="11.75"
                    stroke="currentColor" stroke-width="1.3"/>
              <path class="panel-fill"
                    d="M9 2.25 H11.15 a1.6 1.6 0 0 1 1.6 1.6 V10.15 a1.6 1.6 0 0 1 -1.6 1.6 H9 Z"
                    fill="currentColor" opacity="0"/>
            </svg>
          </button>
          <span class="status-pill" id="shell-status" hidden>starting…</span>
        </div>
      </header>

      <main class="detail" id="detail" data-layout="terminal" data-browser-side="right" data-panel="browser">
        <section class="terminal-area">
          <div class="tab-strip" id="tab-strip"></div>
          <div class="terminal-host" id="terminal-host"></div>
          <div class="file-view" id="file-view" hidden>
            <div class="file-editor-toolbar" role="toolbar" aria-label="File editor actions">
              <span class="file-language" id="file-language">Plain Text</span>
              <span class="file-view-title" id="file-view-title">No file selected</span>
              <span class="file-dirty" id="file-dirty" title="Unsaved changes" aria-label="Unsaved changes" hidden></span>
              <span class="file-view-meta" id="file-view-meta"></span>
              <button
                id="file-save"
                class="file-save"
                type="button"
                title="Save file (⌘S)"
                aria-label="Save file"
                disabled
              >
                Save <kbd>⌘S</kbd>
              </button>
            </div>
            <div class="file-view-path" id="file-view-path" aria-label="Project-relative file path">No file selected</div>
            <div class="file-editor-stage">
              <div class="file-editor-host" id="file-editor-host" aria-label="File editor"></div>
              <div
                class="file-read-only-message"
                id="file-read-only-message"
                role="status"
                aria-live="polite"
                hidden
              >
                Read-only — this file cannot be edited.
              </div>
            </div>
            <div class="file-status-bar">
              <span id="file-status" role="status" aria-live="polite">Ready</span>
              <span id="file-cursor" aria-label="Cursor position">Ln 1, Col 1</span>
            </div>
          </div>
          <div class="command-bar" id="command-bar">
            <span class="command-prompt">›</span>
            <input
              id="command-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Slash command — psyche (/new-thread, /preview), agent skills + plugins (/security-review, /myplugin:foo), or any text → active terminal"
            />
          </div>
          <div class="palette" id="palette" hidden></div>
        </section>
        <div
          class="splitter"
          id="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-valuemin="25"
          aria-valuemax="85"
          aria-valuenow="60"
          tabindex="0"
          title="Resize terminal and browser panes"
        ></div>
        <section class="browser-pane">
        <div class="panel panel-browser">
          <header class="pane-header browser-bar">
            <button id="browser-collapse" class="icon-btn ghost-btn" title="Hide panel (⌘⌥B)" aria-label="Hide panel">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.5 6.25 8 9.75l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="back" class="icon-btn nav-btn" title="Back" aria-label="Back">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.75 4.25 6 8l3.75 3.75" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="forward" class="icon-btn nav-btn" title="Forward" aria-label="Forward">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6.25 4.25 10 8l-3.75 3.75" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="reload" class="icon-btn nav-btn" title="Reload" aria-label="Reload">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M12.2 6.2A4.6 4.6 0 1 0 12.6 9" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M12.25 3.8v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input id="url" type="url" placeholder="example.com or localhost:5173 — Enter to load" />
            <button id="open-external" class="icon-btn ghost-btn" title="Open in default browser" aria-label="Open in default browser">↗</button>
          </header>
          <div id="browser-tab-strip" class="browser-tab-strip"></div>
          <div id="preview" class="preview-placeholder">
            <div class="preview-empty">No browser tab yet — type a URL above or press +</div>
          </div>
        </div>

        <div class="panel panel-files">
          <header class="pane-header panel-bar">
            <span class="panel-title">Files</span>
            <span class="panel-crumb" id="files-crumb"></span>
            <button id="files-refresh" class="icon-btn ghost-btn" title="Refresh" aria-label="Refresh file tree">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M12.2 6.2A4.6 4.6 0 1 0 12.6 9" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M12.25 3.8v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </header>
          <div class="panel-body">
            <div class="file-tree" id="file-tree" role="tree" aria-label="Project files"></div>
          </div>
        </div>

        <div class="panel panel-diffs">
          <header class="pane-header panel-bar">
            <span class="panel-title">Diffs</span>
            <span class="panel-crumb" id="diffs-summary"></span>
            <button id="diffs-refresh" class="icon-btn ghost-btn" title="Refresh" aria-label="Refresh diffs">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M12.2 6.2A4.6 4.6 0 1 0 12.6 9" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M12.25 3.8v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </header>
          <div class="panel-body panel-split">
            <div class="diff-files" id="diff-files" role="list" aria-label="Changed files"></div>
            <div class="diff-detail" id="diff-detail">
              <div class="diff-detail-status">
                <span id="diff-metadata" role="status" aria-live="polite"></span>
                <span id="diff-truncation" role="alert" hidden></span>
              </div>
              <div class="diff-editor-host" id="diff-editor-host"></div>
            </div>
          </div>
        </div>

        <div class="panel panel-git">
          <header class="pane-header panel-bar">
            <span class="panel-title">Git</span>
            <span class="panel-crumb" id="git-branch"></span>
            <button id="git-open-remote" class="icon-btn ghost-btn" title="Open repository on GitHub" aria-label="Open repository on GitHub" disabled>
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6.25 3.5H3.9c-.9 0-1.6.7-1.6 1.6v6c0 .9.7 1.6 1.6 1.6h6c.9 0 1.6-.7 1.6-1.6V8.75" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><path d="M9.25 2.75h4v4M13.25 2.75 7.75 8.25" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="git-refresh" class="icon-btn ghost-btn" title="Refresh" aria-label="Refresh git state">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M12.2 6.2A4.6 4.6 0 1 0 12.6 9" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/><path d="M12.25 3.8v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </header>
          <div class="panel-body">
            <div class="git-view" id="git-view"></div>
          </div>
        </div>
        </section>
      </main>

      <nav class="rail rail-right" id="rail-right" data-tauri-drag-region
           role="toolbar" aria-orientation="vertical" aria-label="Panels">
        <button class="rail-btn" data-panel-btn="browser" aria-pressed="false"
                title="Browser (⌘⌥B)" aria-label="Browser panel">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.35"/>
            <path d="M2.4 8h11.2M8 2.4c1.5 1.7 2.3 3.6 2.3 5.6S9.5 12 8 13.6C6.5 12 5.7 10 5.7 8s.8-3.9 2.3-5.6z"
                  fill="none" stroke="currentColor" stroke-width="1.35"/>
          </svg>
        </button>
        <button class="rail-btn" data-panel-btn="files" aria-pressed="false"
                title="Files" aria-label="File tree panel">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M3.5 2.5v9.25a1.25 1.25 0 0 0 1.25 1.25H7"
                  fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path d="M3.5 7.5H7" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <rect x="8" y="2" width="5" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="8" y="6" width="5" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="8" y="11" width="5" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
        <button class="rail-btn" data-panel-btn="diffs" aria-pressed="false"
                title="Diffs" aria-label="Diff viewer panel">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M4.4 2.4v4.2M2.3 4.5h4.2" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
            <path d="M9.5 11.5h4.2" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round"/>
            <path d="M2.6 9.4h5M2.6 12.2h4" fill="none" stroke="currentColor"
                  stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
            <path d="M9.3 4.2h4.4M9.3 6.9h3.2" fill="none" stroke="currentColor"
                  stroke-width="1.2" stroke-linecap="round" opacity=".5"/>
          </svg>
        </button>
        <button class="rail-btn" data-panel-btn="git" aria-pressed="false"
                title="Git / GitHub" aria-label="Git panel">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <circle cx="4.8" cy="3.9" r="1.7" fill="none" stroke="currentColor" stroke-width="1.35"/>
            <circle cx="4.8" cy="12.1" r="1.7" fill="none" stroke="currentColor" stroke-width="1.35"/>
            <circle cx="11.2" cy="6.2" r="1.7" fill="none" stroke="currentColor" stroke-width="1.35"/>
            <path d="M4.8 5.6v4.8" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
            <path d="M11.2 7.9c0 2.1-1.9 2.9-4.6 3.2" fill="none" stroke="currentColor"
                  stroke-width="1.35" stroke-linecap="round"/>
          </svg>
        </button>
      </nav>
    </div>
    <dialog
      class="file-decision-dialog"
      id="dirty-file-dialog"
      aria-labelledby="dirty-file-title"
      aria-describedby="dirty-file-message"
    >
      <div class="file-decision-card">
        <h2 id="dirty-file-title">Save changes?</h2>
        <p id="dirty-file-message"></p>
        <div class="file-decision-actions" data-decision-mode="dirty">
          <button id="dirty-file-cancel" type="button">Cancel</button>
          <button id="dirty-file-discard" class="danger" type="button">Discard</button>
          <button id="dirty-file-save" class="primary" type="button">Save</button>
        </div>
        <div class="file-decision-actions" data-decision-mode="conflict" hidden>
          <button id="dirty-file-keep-editing" type="button">Keep Editing</button>
          <button id="dirty-file-reload" class="primary" type="button">Reload</button>
        </div>
      </div>
    </dialog>
    <script src="./editor.bundle.js" defer></script>
    <script src="./sessions.bundle.js" defer></script>
    <script src="./main.js" defer></script>
  </body>
</html>
