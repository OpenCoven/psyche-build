schema_version: opencoven.agent-repo/v1

repository:
  name: OpenCoven/psyche-build
  role: reference-client-and-coding-cockpit
  lifecycle: active
  roadmap: docs/POST-RELEASE-EXECUTION.md
  canonical_for:
    - psyche-build.product-behavior
    - psyche-build.local-lane-and-pane-orchestration
    - psyche-build.tmux-worktree-git-integration
    - psyche-build.desktop-client
    - psyche-build.planned-ios-companion
    - psyche-build.product-local-control-plane
  explicitly_not_canonical_for:
    - psyche.protocol-identity-and-lifecycle
    - familiar.person-binding
    - threads.authorization-policy
    - coven.daemon-session-persistence
    - tracker.runtime-identity
    - provider-session.runtime-identity

risk:
  class: R4
  network_policy: deny-by-default-in-tests-explicit-in-adapters-and-optional-gates
  secrets_policy: forbidden-in-repository-fixtures-logs-support-bundles-and-evidence
  protected_paths:
    - src/orchestration/**
    - src/control/**
    - src/actions/**
    - src/mcp/**
    - src/daemon/**
    - src/adapters/**
    - native/**
    - scripts/beads-project-sync/**
    - scripts/release*
    - scripts/smoke*
    - .github/workflows/**
    - package.json
    - pnpm-lock.yaml
    - .beads/**
  generated_paths:
    - src/utils/generated-agents-doc.ts
    - native/ios/Psyche.xcodeproj/**
    - native/ios/PsycheApp/Resources/Info.plist
  external_side_effects:
    - git-branch-worktree-and-merge
    - pull-request-publication
    - process-and-terminal-control
    - browser-and-provider-actions
    - github-project-mutation
    - credential-and-secure-store-access
    - desktop-and-ios-release-publication

agent:
  entrypoint: AGENTS.md
  bootstrap: ./scripts/agent-bootstrap
  verify:
    fast: ./scripts/agent-check fast
    full: ./scripts/agent-check full
    optional_ios: PSYCHE_AGENT_CHECK_IOS=1 ./scripts/agent-check full
    optional_tauri: PSYCHE_AGENT_CHECK_TAURI=1 ./scripts/agent-check full
    optional_tracker: PSYCHE_AGENT_CHECK_TRACKER=1 ./scripts/agent-check full
  required_completion_evidence:
    - owning-github-outcome
    - owning-bead-when-applicable
    - exact-head-sha
    - exact-commands-and-results
    - risk-authority-and-protected-paths
    - generated-artifact-provenance
    - migration-rollback-and-recovery
    - support-and-security-impact
    - remaining-platform-or-runtime-gaps

contracts:
  produces:
    - id: psyche-build.product.v0
      status: supported-macos-v0.0.1
      support: docs/SUPPORT-MATRIX.md
    - id: psyche-build.control.receipt.v1
      status: product-local
      path: src/control/types.ts
    - id: psyche-build.orchestration.v1
      status: product-local
      path: src/orchestration
  consumes:
    - id: psyche.protocol.v1
      status: planned-not-yet-pinned
      owner: https://github.com/OpenCoven/psyche-build/issues/253
      plan: docs/PSYCHE-CONFORMANCE.md
    - id: coven.session-backend
      status: adapter
      path: src/orchestration/covenSessionBackend.ts
    - id: beads.internal-planning
      status: implementation-tracker-only
      path: .beads/README.md

toolchains:
  node_minimum: 20.10.0
  pnpm: 10.34.5
  git_minimum: 2.20.0
  tmux_minimum: 3.0
  lockfiles:
    - pnpm-lock.yaml
  optional:
    - xcodegen
    - xcodebuild
    - rust-cargo-tauri

tracking:
  public_outcomes: github-issues-and-pull-requests
  internal_dependencies: beads
  runtime_identity: neither
  roadmap_control: https://github.com/OpenCoven/psyche-build/issues/195
  agent_readiness: https://github.com/OpenCoven/psyche-build/issues/252
  psyche_conformance: https://github.com/OpenCoven/psyche-build/issues/253
