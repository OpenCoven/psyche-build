name: Setup pinned XcodeGen
description: Install the checksum-verified XcodeGen release used by CI and release workflows

runs:
  using: composite
  steps:
    - name: Install checksum-verified XcodeGen
      shell: bash
      run: |
        set -euo pipefail
        XCODEGEN_VERSION="2.45.4"
        XCODEGEN_SHA256="090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
        XCODEGEN_ZIP="$RUNNER_TEMP/xcodegen.zip"
        XCODEGEN_UNPACKED="$RUNNER_TEMP/xcodegen"
        XCODEGEN_INSTALL_DIR="$RUNNER_TEMP/xcodegen-install"
        curl --fail-with-body --silent --show-error --location \
          "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
          --output "$XCODEGEN_ZIP"
        echo "$XCODEGEN_SHA256  $XCODEGEN_ZIP" | shasum -a 256 -c -
        unzip -q "$XCODEGEN_ZIP" -d "$XCODEGEN_UNPACKED"
        XCODEGEN_INSTALLER="$(find "$XCODEGEN_UNPACKED" -type f -name install.sh -print -quit)"
        test -n "$XCODEGEN_INSTALLER"
        mkdir -p "$XCODEGEN_INSTALL_DIR"
        bash "$XCODEGEN_INSTALLER" "$XCODEGEN_INSTALL_DIR"
        test -x "$XCODEGEN_INSTALL_DIR/bin/xcodegen"
        test -d "$XCODEGEN_INSTALL_DIR/share/xcodegen/SettingPresets"
        echo "$XCODEGEN_INSTALL_DIR/bin" >> "$GITHUB_PATH"
