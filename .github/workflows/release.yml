name: Release

# Publishes only signed and notarized macOS artifacts. The workflow builds the
# exact release tag, verifies both native architectures independently, and keeps
# the GitHub Release in draft state until both DMGs and SHA256SUMS (plus the
# signed update manifest, once a current key is provisioned) are attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to rebuild"
        required: true
        type: string
      desktop_only:
        description: "Publish macOS and Homebrew without TestFlight"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag_object_sha: ${{ steps.signed-tag.outputs.tag_object_sha }}
      desktop_only: ${{ steps.release.outputs.desktop_only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a public release source
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_IS_PRIVATE" = "true" ]; then
            echo "::error::A public Homebrew release cannot be published from a private repository"
            exit 1
          fi

      - name: Resolve and verify release tag
        id: release
        env:
          RAW_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          DESKTOP_ONLY="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.desktop_only == 'true' }}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked out source does not match $RELEASE_TAG"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag must point to a commit on origin/main"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "desktop_only=$DESKTOP_ONLY" >> "$GITHUB_OUTPUT"

      - name: Require a verified signed tag
        id: signed-tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REF_ENDPOINT="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          REF_JSON_PATH="$RUNNER_TEMP/release-tag-ref.json"
          gh api "$REF_ENDPOINT" > "$REF_JSON_PATH"
          TAG_OBJECT_TYPE="$(jq -r '.object.type' "$REF_JSON_PATH")"
          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "::error::Release tag must be an annotated tag with a verified signature"
            exit 1
          fi
          TAG_OBJECT_SHA="$(jq -r '.object.sha' "$REF_JSON_PATH")"
          LOCAL_TAG_OBJECT_SHA="$(git rev-parse "$RELEASE_TAG^{tag}")"
          if [ "$TAG_OBJECT_SHA" != "$LOCAL_TAG_OBJECT_SHA" ]; then
            echo "::error::Remote release tag object does not match the verified local tag"
            exit 1
          fi

          TAG_OBJECT_JSON_PATH="$RUNNER_TEMP/release-tag-object.json"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" > "$TAG_OBJECT_JSON_PATH"
          TAG_TARGET_TYPE="$(jq -r '.object.type' "$TAG_OBJECT_JSON_PATH")"
          TAG_TARGET_SHA="$(jq -r '.object.sha' "$TAG_OBJECT_JSON_PATH")"
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_TARGET_TYPE" != "commit" ]; then
            echo "::error::Release tag object must target a commit"
            exit 1
          fi
          if [ "$TAG_TARGET_SHA" != "$TAG_COMMIT" ] || \
             [ "$TAG_TARGET_SHA" != "$HEAD_COMMIT" ]; then
            echo "::error::Remote release tag target does not match the verified release commit"
            exit 1
          fi
          SIGNATURE_VERIFIED="$(jq -r '.verification.verified' "$TAG_OBJECT_JSON_PATH")"
          if [ "$SIGNATURE_VERIFIED" != "true" ]; then
            echo "::error::Release tag must be an annotated tag with a verified signature"
            exit 1
          fi
          echo "tag_object_sha=$TAG_OBJECT_SHA" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.95.0 action @ 2026-03-27
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C52' "$RUNNER_TEMP/xcode-version.txt"

      - name: Set up XcodeGen for iOS verification
        if: steps.release.outputs.desktop_only != 'true'
        uses: ./.github/actions/setup-xcodegen

      - name: Require matching release versions
        run: pnpm release:check -- "$RELEASE_TAG"

      - name: Verify shared TypeScript, protocol, and package surfaces
        run: |
          set -euo pipefail
          pnpm docs:focus:check
          pnpm --dir docs build
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm smoke:pack

      - name: Verify Rust and Tauri surfaces
        run: |
          set -euo pipefail
          MANIFEST="native/desktop/psyche-build-tauri/src-tauri/Cargo.toml"
          cargo fmt --manifest-path "$MANIFEST" --check
          cargo test --manifest-path "$MANIFEST" --locked
          cargo check --manifest-path "$MANIFEST" --locked
          pnpm --dir native/desktop/psyche-build-tauri build:web

      - name: Require iOS 26.2 iPhone 16 Pro simulator
        if: steps.release.outputs.desktop_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          if ! jq -e '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | any(.name == "iPhone 16 Pro" and .isAvailable == true)
          ' "$RUNNER_TEMP/available-simulators.json" >/dev/null; then
            echo "::error::iOS 26.2 iPhone 16 Pro simulator is unavailable"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Verify generated iOS project, Core, app, and UI tests
        if: steps.release.outputs.desktop_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm ios:project:check
          xcodebuild test \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheCore \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-core-derived-data"
          xcodebuild build \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-app-build-derived-data"
          xcodebuild test \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-app-test-derived-data"

  build-macos:
    name: Build ${{ matrix.arch }} DMG
    needs: verify
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set release metadata
        env:
          RAW_RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$TAG_COMMIT" != "$EXPECTED_RELEASE_SHA" ] || \
             [ "$(git rev-parse HEAD)" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked out source does not match $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "ARCH=$MATRIX_ARCH" >> "$GITHUB_ENV"
          echo "RUST_TARGET=$MATRIX_TARGET" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.95.0 action @ 2026-03-27
        with:
          toolchain: 1.95.0

      - name: Install locked dependencies and Rust target
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          rustup target add "$RUST_TARGET"
          pnpm release:check -- "$RELEASE_TAG"

      - name: Require signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required release environment secret $secret_name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/psyche-macos-signing.keychain-db"
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          decode_base64() {
            if base64 --decode </dev/null >/dev/null 2>&1; then
              base64 --decode
            else
              base64 -D
            fi
          }
          printf '%s' "$APPLE_CERTIFICATE" | decode_base64 > "$CERTIFICATE_PATH"
          chmod 0600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed and notarized DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir native/desktop/psyche-build-tauri build:web
          pnpm --dir native/desktop/psyche-build-tauri exec tauri build \
            --target "$RUST_TARGET" \
            --bundles dmg

      - name: Verify Gatekeeper and notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="native/desktop/psyche-build-tauri/src-tauri/target/$RUST_TARGET/release/bundle/dmg"
          DMG_PATH="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No DMG found in $BUNDLE_DIR"
            exit 1
          fi
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/psyche-dmg.XXXXXX")"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          APP_PATH="$MOUNT_POINT/Psyche Build.app"
          if [ ! -d "$APP_PATH" ]; then
            hdiutil detach "$MOUNT_POINT"
            echo "::error::DMG does not contain Psyche Build.app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          hdiutil detach "$MOUNT_POINT"
          xcrun stapler validate "$DMG_PATH"

          ARTIFACT_DIR="$RUNNER_TEMP/release-artifact"
          mkdir -p "$ARTIFACT_DIR"
          ARTIFACT_NAME="Psyche-Build-v${RELEASE_VERSION}-${ARCH}.dmg"
          cp "$DMG_PATH" "$ARTIFACT_DIR/$ARTIFACT_NAME"
          echo "ARTIFACT_PATH=$ARTIFACT_DIR/$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload verified DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psyche-build-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral macOS signing material
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          CLEANUP_FAILED=0
          KEYCHAIN_PATH="$RUNNER_TEMP/psyche-macos-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          if [ -e "$KEYCHAIN_PATH" ] && ! security delete-keychain "$KEYCHAIN_PATH"; then
            CLEANUP_FAILED=1
          fi
          if ! rm -f "$CERTIFICATE_PATH"; then
            CLEANUP_FAILED=1
          fi
          exit "$CLEANUP_FAILED"

  upload-ios:
    name: Upload iOS build to TestFlight
    needs: verify
    if: needs.verify.outputs.desktop_only != 'true'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set and validate release metadata
        env:
          RAW_RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$EXPECTED_RELEASE_SHA" ] || \
             [ "$(git rev-parse HEAD)" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked out source does not match $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "EXPECTED_RELEASE_SHA=$EXPECTED_RELEASE_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies and verify release version
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm release:check -- "$RELEASE_TAG"

      - name: Require iOS distribution credentials
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            APPLE_DISTRIBUTION_CERTIFICATE \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY \
            APPLE_TEAM_ID
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required release environment secret $secret_name"
              exit 1
            fi
          done

          umask 077
          APP_STORE_CONNECT_PRIVATE_KEY_PATH="$RUNNER_TEMP/app-store-connect-key.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          chmod 0600 "$APP_STORE_CONNECT_PRIVATE_KEY_PATH"
          echo "APP_STORE_CONNECT_PRIVATE_KEY_PATH=$APP_STORE_CONNECT_PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Apple Distribution certificate into an ephemeral keychain
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/psyche-ios-signing.keychain-db"
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          decode_base64() {
            if base64 --decode </dev/null >/dev/null 2>&1; then
              base64 --decode
            else
              base64 -D
            fi
          }
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE" | decode_base64 > "$CERTIFICATE_PATH"
          chmod 0600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Require pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C52' "$RUNNER_TEMP/xcode-version.txt"

      - uses: ./.github/actions/setup-xcodegen

      - name: Generate and verify the iOS project
        run: pnpm ios:project:check

      - name: Archive the signed iOS app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PsycheBuild.xcarchive" \
            -configuration Release \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=1 \
            MARKETING_VERSION="$RELEASE_VERSION" \
            PSYCHE_RELEASE_SHA="$EXPECTED_RELEASE_SHA" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify archived app identity and provenance
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/PsycheBuild.xcarchive/Products/Applications/Psyche Build.app/Info.plist"
          test -f "$INFO_PLIST"
          require_plist_value() {
            local key="$1"
            local expected="$2"
            local actual
            actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$INFO_PLIST")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Archive $key does not match the verified release"
              exit 1
            fi
          }
          require_plist_value CFBundleIdentifier ai.opencoven.psyche-ios
          require_plist_value CFBundleDisplayName 'Psyche Build'
          require_plist_value CFBundleShortVersionString "$RELEASE_VERSION"
          require_plist_value CFBundleVersion 1
          require_plist_value PsycheReleaseCommit "$EXPECTED_RELEASE_SHA"

      - name: Export the IPA and generate TestFlight notes
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/ios-export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PsycheBuild.xcarchive" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist native/ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          IPA_COUNT="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          if [ "$IPA_COUNT" != "1" ]; then
            echo "::error::Expected exactly one exported IPA; found $IPA_COUNT"
            exit 1
          fi
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          TESTFLIGHT_NOTES_PATH="$RUNNER_TEMP/testflight-notes.txt"
          node scripts/release-notes.mjs --testflight "$RELEASE_VERSION" > "$TESTFLIGHT_NOTES_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "TESTFLIGHT_NOTES_PATH=$TESTFLIGHT_NOTES_PATH" >> "$GITHUB_ENV"

      - name: Reuse an exact existing TestFlight build when possible
        id: preflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          pnpm release:testflight -- \
            --bundle-id ai.opencoven.psyche-ios \
            --version "$RELEASE_VERSION" \
            --build-number 1 \
            --locale en-US \
            --notes-file "$TESTFLIGHT_NOTES_PATH" \
            --release-sha "$EXPECTED_RELEASE_SHA" \
            --timeout-seconds 2700 \
            --reuse-existing
          REUSE_STATUS=$?
          set -e
          if [ "$REUSE_STATUS" = "0" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ "$REUSE_STATUS" = "2" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            exit "$REUSE_STATUS"
          fi

      - name: Validate and upload the IPA
        if: steps.preflight.outputs.upload == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$APP_STORE_CONNECT_PRIVATE_KEY_PATH" \
            --output-format json \
            > "$RUNNER_TEMP/altool-validation.json"
          jq -e . "$RUNNER_TEMP/altool-validation.json" >/dev/null
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$APP_STORE_CONNECT_PRIVATE_KEY_PATH" \
            --output-format json \
            > "$RUNNER_TEMP/altool-upload.json"
          jq -e . "$RUNNER_TEMP/altool-upload.json" >/dev/null

      - name: Verify uploaded build and localize TestFlight notes
        if: steps.preflight.outputs.upload == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm release:testflight -- \
            --bundle-id ai.opencoven.psyche-ios \
            --version "$RELEASE_VERSION" \
            --build-number 1 \
            --locale en-US \
            --notes-file "$TESTFLIGHT_NOTES_PATH" \
            --release-sha "$EXPECTED_RELEASE_SHA" \
            --timeout-seconds 2700

      - name: Confirm exact existing build reuse
        if: steps.preflight.outputs.upload != 'true'
        run: echo "Exact TestFlight build and release provenance already verified"

      - name: Remove ephemeral iOS signing material
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          CLEANUP_FAILED=0
          KEYCHAIN_PATH="$RUNNER_TEMP/psyche-ios-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          PRIVATE_KEY_PATH="$RUNNER_TEMP/app-store-connect-key.p8"
          if [ -e "$KEYCHAIN_PATH" ] && ! security delete-keychain "$KEYCHAIN_PATH"; then
            CLEANUP_FAILED=1
          fi
          if ! rm -f "$CERTIFICATE_PATH"; then
            CLEANUP_FAILED=1
          fi
          if ! rm -f "$PRIVATE_KEY_PATH"; then
            CLEANUP_FAILED=1
          fi
          exit "$CLEANUP_FAILED"

  publish:
    name: Publish GitHub Release
    needs: [verify, build-macos, upload-ios]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.build-macos.result == 'success' &&
      (
        needs.upload-ios.result == 'success' ||
        (
          needs.verify.outputs.desktop_only == 'true' &&
          needs.upload-ios.result == 'skipped'
        )
      )
    environment: release
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      release_tag: ${{ needs.verify.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set release metadata
        env:
          RAW_RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          EXPECTED_RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$EXPECTED_RELEASE_SHA" ] || \
             [ "$(git rev-parse HEAD)" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Checked out source does not match $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download verified DMGs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: psyche-build-*
          path: artifacts
          merge-multiple: true

      - name: Require complete artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          ARM_DMG="Psyche-Build-v${RELEASE_VERSION}-aarch64.dmg"
          INTEL_DMG="Psyche-Build-v${RELEASE_VERSION}-x86_64.dmg"
          test -f "artifacts/$ARM_DMG"
          test -f "artifacts/$INTEL_DMG"
          ACTUAL_COUNT="$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "$ACTUAL_COUNT" != "2" ]; then
            echo "::error::Expected exactly two verified DMGs; found $ACTUAL_COUNT"
            exit 1
          fi
          (
            cd artifacts
            shasum -a 256 "$ARM_DMG" "$INTEL_DMG" > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      # The signed update manifest is published only once the owner commits a
      # current public key to release/update-manifest-keys.json. Until then the
      # release proceeds without it and says so. Once a current key exists, a
      # missing secret or a failed self-verification blocks publication.
      #
      # Manual recovery runs this workflow from main against an older tag. A
      # tag without the keys file predates the feature and is a legacy tag:
      # it publishes without a manifest. The keys file was added together with
      # the script, so a feature-era tag always has it and cannot silently drop
      # signing. If such a tag lacks the script, the workflow revision's copy
      # is used; if that cannot be obtained, the job fails.
      - name: Resolve update manifest signing
        id: update-manifest
        shell: bash
        run: |
          set -euo pipefail
          KEYS_FILE=release/update-manifest-keys.json
          if [ ! -e "$KEYS_FILE" ] && [ ! -L "$KEYS_FILE" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Update manifest not published::$RELEASE_TAG predates update manifest signing (no $KEYS_FILE), so this release publishes no update-manifest.json."
            exit 0
          fi
          UPDATE_MANIFEST_SCRIPT="$PWD/scripts/update-manifest.mjs"
          if [ ! -f "$UPDATE_MANIFEST_SCRIPT" ]; then
            if [[ ! "${GITHUB_WORKFLOW_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$KEYS_FILE exists but no update manifest resolver is available"
              exit 1
            fi
            UPDATE_MANIFEST_SCRIPT="$RUNNER_TEMP/update-manifest.mjs"
            if ! git show "$GITHUB_WORKFLOW_SHA:scripts/update-manifest.mjs" > "$UPDATE_MANIFEST_SCRIPT"; then
              echo "::error::$KEYS_FILE exists but the workflow revision's update manifest resolver cannot be read"
              exit 1
            fi
            echo "Using the workflow revision's update manifest script for $RELEASE_TAG"
          fi
          echo "UPDATE_MANIFEST_SCRIPT=$UPDATE_MANIFEST_SCRIPT" >> "$GITHUB_ENV"
          STATUS="$(node "$UPDATE_MANIFEST_SCRIPT" status --keys "$KEYS_FILE")"
          case "$STATUS" in
            active=false)
              echo "active=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Update manifest not published::release/update-manifest-keys.json has no current key, so this release publishes no update-manifest.json. See docs/RELEASE.md, Update manifest signing."
              ;;
            active=true$'\n'current_key_id=*)
              echo "active=true" >> "$GITHUB_OUTPUT"
              echo "Update manifest signing is active for key ${STATUS##*=}"
              ;;
            *)
              echo "::error::Unrecognized update manifest key status"
              exit 1
              ;;
          esac

      - name: Build update manifest
        if: steps.update-manifest.outputs.active == 'true'
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          VERIFIED_TAG_OBJECT_SHA: ${{ needs.verify.outputs.release_tag_object_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The tagger date is read from the local tag object, so it must be the
          # exact signed object the verify job checked against GitHub.
          if [[ ! "$VERIFIED_TAG_OBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The verify job did not report a signed release tag object"
            exit 1
          fi
          LOCAL_TAG_OBJECT_SHA="$(git rev-parse --verify "$RELEASE_TAG^{tag}")"
          if [ "$LOCAL_TAG_OBJECT_SHA" != "$VERIFIED_TAG_OBJECT_SHA" ]; then
            echo "::error::Release tag object does not match the verified signed tag"
            exit 1
          fi
          # The signed tag's tagger date makes a retried run reproduce the same
          # manifest bytes, so an already-published release can be byte-compared.
          PUBLISHED_AT="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$RELEASE_TAG")"
          if [ -z "$PUBLISHED_AT" ]; then
            echo "::error::Release tag $RELEASE_TAG has no tagger date for the update manifest"
            exit 1
          fi
          node "$UPDATE_MANIFEST_SCRIPT" build \
            --version "${RELEASE_VERSION}" \
            --tag "$RELEASE_TAG" \
            --source-sha "$RELEASE_SHA" \
            --sha256sums artifacts/SHA256SUMS \
            --published-at "$PUBLISHED_AT" \
            --expires-in-days 30 \
            --out artifacts/update-manifest.json

      - name: Sign update manifest
        if: steps.update-manifest.outputs.active == 'true'
        env:
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_MANIFEST_SIGNING_KEY" ]; then
            echo "::error::Missing required release environment secret UPDATE_MANIFEST_SIGNING_KEY while release/update-manifest-keys.json names a current key"
            exit 1
          fi
          node "$UPDATE_MANIFEST_SCRIPT" sign \
            --manifest artifacts/update-manifest.json \
            --keys release/update-manifest-keys.json \
            --key-env UPDATE_MANIFEST_SIGNING_KEY \
            --out artifacts/update-manifest.json.sig

      - name: Verify signed update manifest
        if: steps.update-manifest.outputs.active == 'true'
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node "$UPDATE_MANIFEST_SCRIPT" verify \
            --manifest artifacts/update-manifest.json \
            --signature artifacts/update-manifest.json.sig \
            --keys release/update-manifest-keys.json \
            --expect-tag "$RELEASE_TAG" \
            --expect-source-sha "$RELEASE_SHA" \
            --sha256sums artifacts/SHA256SUMS

      - name: Generate curated GitHub release notes
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NOTES_PATH="$RUNNER_TEMP/github-release-notes.md"
          node scripts/release-notes.mjs --github "$RELEASE_VERSION" > "$RELEASE_NOTES_PATH"
          test -s "$RELEASE_NOTES_PATH"
          echo "RELEASE_NOTES_PATH=$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"

      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MANIFEST_ACTIVE: ${{ steps.update-manifest.outputs.active }}
        shell: bash
        run: |
          set -euo pipefail
          # The exact public asset set: both DMGs and SHA256SUMS, plus the
          # signed update manifest and its signature only when signing is active.
          RELEASE_ASSETS=(
            "Psyche-Build-v${RELEASE_VERSION}-aarch64.dmg"
            "Psyche-Build-v${RELEASE_VERSION}-x86_64.dmg"
            SHA256SUMS
          )
          case "$UPDATE_MANIFEST_ACTIVE" in
            true)
              RELEASE_ASSETS+=(update-manifest.json update-manifest.json.sig)
              ;;
            false)
              ;;
            *)
              echo "::error::Update manifest activation is unresolved"
              exit 1
              ;;
          esac
          EXPECTED_ASSET_COUNT="${#RELEASE_ASSETS[@]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              mkdir -p published-assets
              gh release download "$RELEASE_TAG" --dir published-assets
              PUBLISHED_COUNT="$(find published-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
              if [ "$PUBLISHED_COUNT" != "$EXPECTED_ASSET_COUNT" ]; then
                echo "::error::Published release must contain exactly $EXPECTED_ASSET_COUNT assets; found $PUBLISHED_COUNT"
                exit 1
              fi
              for asset in "${RELEASE_ASSETS[@]}"
              do
                test -f "published-assets/$asset"
                cmp "artifacts/$asset" "published-assets/$asset"
              done
              (
                cd published-assets
                shasum -a 256 -c SHA256SUMS
              )
              PUBLISHED_NOTES_PATH="$RUNNER_TEMP/published-release-notes.md"
              PUBLISHED_RELEASE_JSON="$RUNNER_TEMP/published-release.json"
              gh release view "$RELEASE_TAG" --json body > "$PUBLISHED_RELEASE_JSON"
              node --input-type=module -e '
                import { readFileSync } from "node:fs";
                const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
                if (typeof release.body !== "string") process.exit(1);
                process.stdout.write(release.body);
              ' "$PUBLISHED_RELEASE_JSON" > "$PUBLISHED_NOTES_PATH"
              cmp "$RELEASE_NOTES_PATH" "$PUBLISHED_NOTES_PATH"
              echo "Published release assets and notes match the verified build output"
              exit 0
            fi
            gh release edit "$RELEASE_TAG" \
              --title "Psyche Build $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Psyche Build $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi
          gh release upload "$RELEASE_TAG" --clobber "${RELEASE_ASSETS[@]/#/artifacts/}"

          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release must remain draft until its exact asset set is verified"
            exit 1
          fi
          EXPECTED_DRAFT_ASSETS="$RUNNER_TEMP/expected-draft-assets.txt"
          ACTUAL_DRAFT_ASSETS="$RUNNER_TEMP/actual-draft-assets.txt"
          printf '%s\n' "${RELEASE_ASSETS[@]}" \
            | LC_ALL=C sort > "$EXPECTED_DRAFT_ASSETS"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$ACTUAL_DRAFT_ASSETS"
          if ! cmp "$EXPECTED_DRAFT_ASSETS" "$ACTUAL_DRAFT_ASSETS"; then
            echo "::error::Draft release must contain exactly the expected release assets: ${RELEASE_ASSETS[*]}"
            exit 1
          fi

          DRAFT_ASSET_DIR="$RUNNER_TEMP/draft-assets"
          mkdir -p "$DRAFT_ASSET_DIR"
          gh release download "$RELEASE_TAG" --dir "$DRAFT_ASSET_DIR"
          DRAFT_ASSET_COUNT="$(find "$DRAFT_ASSET_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "$DRAFT_ASSET_COUNT" != "$EXPECTED_ASSET_COUNT" ]; then
            echo "::error::Draft release must contain exactly $EXPECTED_ASSET_COUNT assets; found $DRAFT_ASSET_COUNT"
            exit 1
          fi
          for asset in "${RELEASE_ASSETS[@]}"
          do
            cmp "artifacts/$asset" "$DRAFT_ASSET_DIR/$asset"
          done
          (
            cd "$DRAFT_ASSET_DIR"
            shasum -a 256 -c SHA256SUMS
          )
          echo "Draft release assets match the verified build output"
          gh release edit "$RELEASE_TAG" --draft=false --latest


  homebrew-tap-pr:
    # Proposes the Cask bump as a pull request on OpenCoven/homebrew-tap and
    # then proves it by reading the tap back. HOMEBREW_TAP_TOKEN is exposed to
    # the single API step that writes the tap; every read uses this run's
    # read-only token. The job never merges: tap CI and a maintainer do.
    name: Propose and verify Homebrew Cask bump
    needs: publish
    if: always() && needs.publish.result == 'success'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read published SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::$RELEASE_TAG is not a published release"
            exit 1
          fi
          SUMS_DIR="$RUNNER_TEMP/published-sha256sums"
          mkdir -p "$SUMS_DIR"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$SUMS_DIR"
          test -s "$SUMS_DIR/SHA256SUMS"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SHA256SUMS_PATH=$SUMS_DIR/SHA256SUMS" >> "$GITHUB_ENV"

      - name: Open Homebrew tap pull request
        id: tap_pr
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Missing required release environment secret HOMEBREW_TAP_TOKEN"
            exit 1
          fi
          node scripts/homebrew-tap-pr.mjs open --tag "$RELEASE_TAG" --sums "$SHA256SUMS_PATH"

      - name: Verify tap pull request against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_RESULT: ${{ steps.tap_pr.outputs.result }}
          TAP_PR_NUMBER: ${{ steps.tap_pr.outputs.pr_number }}
          TAP_PR_URL: ${{ steps.tap_pr.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --tag "$RELEASE_TAG" --sums "$SHA256SUMS_PATH" --result "$TAP_RESULT")
          if [ -n "$TAP_PR_NUMBER" ]; then
            args+=(--pr "$TAP_PR_NUMBER")
          fi
          node scripts/homebrew-tap-pr.mjs "${args[@]}"
          if [ -n "$TAP_PR_URL" ]; then
            echo "::notice::Homebrew Cask bump verified and awaiting tap CI and review: $TAP_PR_URL"
          fi
