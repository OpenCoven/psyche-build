name: Release

# Publishes only signed and notarized macOS artifacts. The workflow builds the
# exact release tag, verifies both native architectures independently, and keeps
# the GitHub Release in draft state until both DMGs and SHA256SUMS are attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vMAJOR.MINOR.PATCH tag to rebuild"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Require a public release source
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_IS_PRIVATE" = "true" ]; then
            echo "::error::A public Homebrew release cannot be published from a private repository"
            exit 1
          fi

      - name: Resolve and verify release tag
        env:
          RAW_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checked out source does not match $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          components: rustfmt

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require matching release versions
        run: pnpm release:check -- "$RELEASE_TAG"

      - name: Verify TypeScript and package surfaces
        run: |
          set -euo pipefail
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm smoke:pack

      - name: Verify Rust and Tauri surfaces
        run: |
          set -euo pipefail
          MANIFEST="native/macos/psyche-build-tauri/src-tauri/Cargo.toml"
          cargo fmt --manifest-path "$MANIFEST" --check
          cargo test --manifest-path "$MANIFEST" --locked
          cargo check --manifest-path "$MANIFEST" --locked
          pnpm --dir native/macos/psyche-build-tauri build:web

  build-macos:
    name: Build ${{ matrix.arch }} DMG
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set release metadata
        env:
          RAW_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked out source does not match $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "ARCH=$MATRIX_ARCH" >> "$GITHUB_ENV"
          echo "RUST_TARGET=$MATRIX_TARGET" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27

      - name: Install locked dependencies and Rust target
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          rustup target add "$RUST_TARGET"
          pnpm release:check -- "$RELEASE_TAG"

      - name: Require signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required repository secret $secret_name"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/psyche-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          decode_base64() {
            if base64 --decode </dev/null >/dev/null 2>&1; then
              base64 --decode
            else
              base64 -D
            fi
          }
          printf '%s' "$APPLE_CERTIFICATE" | decode_base64 > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed and notarized DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir native/macos/psyche-build-tauri build:web
          pnpm --dir native/macos/psyche-build-tauri exec tauri build \
            --target "$RUST_TARGET" \
            --bundles dmg

      - name: Verify Gatekeeper and notarization
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="native/macos/psyche-build-tauri/src-tauri/target/$RUST_TARGET/release/bundle/dmg"
          DMG_PATH="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No DMG found in $BUNDLE_DIR"
            exit 1
          fi
          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/psyche-dmg.XXXXXX")"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          APP_PATH="$MOUNT_POINT/Psyche Build.app"
          if [ ! -d "$APP_PATH" ]; then
            hdiutil detach "$MOUNT_POINT"
            echo "::error::DMG does not contain Psyche Build.app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          hdiutil detach "$MOUNT_POINT"
          xcrun stapler validate "$DMG_PATH"

          ARTIFACT_DIR="$RUNNER_TEMP/release-artifact"
          mkdir -p "$ARTIFACT_DIR"
          ARTIFACT_NAME="Psyche-Build-v${RELEASE_VERSION}-${ARCH}.dmg"
          cp "$DMG_PATH" "$ARTIFACT_DIR/$ARTIFACT_NAME"
          echo "ARTIFACT_PATH=$ARTIFACT_DIR/$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload verified DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psyche-build-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set release metadata
        env:
          RAW_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$RAW_RELEASE_TAG"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use stable vMAJOR.MINOR.PATCH form"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Download verified DMGs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: psyche-build-*
          path: artifacts
          merge-multiple: true

      - name: Require complete artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          ARM_DMG="Psyche-Build-v${RELEASE_VERSION}-aarch64.dmg"
          INTEL_DMG="Psyche-Build-v${RELEASE_VERSION}-x86_64.dmg"
          test -f "artifacts/$ARM_DMG"
          test -f "artifacts/$INTEL_DMG"
          ACTUAL_COUNT="$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          if [ "$ACTUAL_COUNT" != "2" ]; then
            echo "::error::Expected exactly two verified DMGs; found $ACTUAL_COUNT"
            exit 1
          fi
          (
            cd artifacts
            shasum -a 256 "$ARM_DMG" "$INTEL_DMG" > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published"
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Psyche Build $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            artifacts/Psyche-Build-v${RELEASE_VERSION}-aarch64.dmg \
            artifacts/Psyche-Build-v${RELEASE_VERSION}-x86_64.dmg \
            artifacts/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Notify OpenCoven Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; scheduled tap update will be the fallback"
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/OpenCoven/homebrew-tap/dispatches \
            --data "$(jq -n \
              --arg tag "$RELEASE_TAG" \
              '{event_type: "psyche-build-release", client_payload: {tag: $tag}}')"
