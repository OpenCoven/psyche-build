name: iOS stability qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ios-stability.yml'
      - 'scripts/ios-stability.mjs'
      - '__tests__/iosStability.test.ts'
      - 'native/ios/**'

permissions:
  contents: read

concurrency:
  group: >-
    ios-stability-${{ github.event.pull_request.number }}-${{ contains(github.event.pull_request.body, '<!-- ios-stability: probe -->') && 'probe' || 'cohort' }}
  # Preserve an earlier measurement and its first failure when a new head arrives.
  cancel-in-progress: false

jobs:
  qualify:
    name: iOS stability observations
    # Opt in on the dedicated same-repository branch AND in the PR body. Set the
    # marker to "hold" before an evidence-only push to avoid spending another run.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qualify/510-ios-stability' &&
      (contains(github.event.pull_request.body, '<!-- ios-stability: run -->') ||
      contains(github.event.pull_request.body, '<!-- ios-stability: probe -->'))
    runs-on: macos-15
    timeout-minutes: "${{ contains(github.event.pull_request.body, '<!-- ios-stability: probe -->') && 20 || 260 }}"
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      TEST_ITERATIONS: "${{ contains(github.event.pull_request.body, '<!-- ios-stability: probe -->') && '1' || '25' }}"
      OBSERVATION_SECONDS: "${{ contains(github.event.pull_request.body, '<!-- ios-stability: probe -->') && '600' || '12600' }}"
    steps:
      - name: Checkout exact proposed source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C52' "$RUNNER_TEMP/xcode-version.txt"

      - uses: ./.github/actions/setup-xcodegen

      - name: Require iOS 26.2 iPhone 16 Pro simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          if ! jq -e '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | any(.name == "iPhone 16 Pro" and .isAvailable == true)
          ' "$RUNNER_TEMP/available-simulators.json" >/dev/null; then
            echo "::error::iOS 26.2 iPhone 16 Pro simulator is unavailable"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Generate and verify the iOS project
        run: pnpm ios:project:check

      - name: Locate the disposable qualification output
        run: echo "QUALIFICATION_DIR=$RUNNER_TEMP/psyche-ios-stability" >> "$GITHUB_ENV"

      - name: Build the selected test scheme once
        id: build
        run: node scripts/ios-stability.mjs build "$QUALIFICATION_DIR" "$TEST_ITERATIONS" "$OBSERVATION_SECONDS"

      - name: Observe the fresh-runner repetitions
        id: fresh
        run: node scripts/ios-stability.mjs measure "$QUALIFICATION_DIR" fresh

      - name: Retain a failing build's fixture result bundle
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-stability-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/bundles/build.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Retain the first phase's enumerated observations
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-stability-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/summary.json
          retention-days: 7
          if-no-files-found: error

      - name: Retain the fresh phase's failing fixture result bundle
        if: always() && steps.fresh.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-stability-fresh-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/bundles/fresh.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Observe the reused-runner repetitions
        id: reused
        # A previous failed observation remains failed; this is the separately
        # planned second mode, never a retry to replace its first outcome.
        if: always() && steps.build.outcome == 'success'
        run: node scripts/ios-stability.mjs measure "$QUALIFICATION_DIR" reused

      - name: Finalize the bounded measurement record
        if: always() && steps.build.outcome == 'success'
        run: node scripts/ios-stability.mjs finalize "$QUALIFICATION_DIR"

      - name: Retain final enumerated observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-stability-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/summary.json
          retention-days: 7
          if-no-files-found: warn

      - name: Retain the reused phase's failing fixture result bundle
        if: always() && steps.reused.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-stability-reused-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_DIR }}/bundles/reused.xcresult
          retention-days: 7
          if-no-files-found: warn
