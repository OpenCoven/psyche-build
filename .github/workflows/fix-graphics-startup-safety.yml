name: Fix graphics diagnostics startup safety

on:
  push:
    branches:
      - feat/graphics-evidence-diagnostics
    paths:
      - .github/workflows/fix-graphics-startup-safety.yml

permissions:
  contents: write

concurrency:
  group: fix-graphics-startup-safety
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'OpenCoven/psyche-build' && github.ref == 'refs/heads/feat/graphics-evidence-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the diagnostics branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/graphics-evidence-diagnostics
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile with current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

      - name: Make graphics diagnostics unable to block startup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('native/desktop/psyche-build-tauri/web/runtime/graphics-diagnostics.ts')
          source = source_path.read_text()

          old_catch = """  } catch (error) {
            (deps.reportError ?? defaultReportError)(error, 'collect runtime graphics report');
            return null;
          }
        }
        """
          new_catch = """  } catch (error) {
            safelyReportRuntimeGraphicsError(deps, error);
            return null;
          }
        }
        """
          if source.count(old_catch) != 1:
              raise SystemExit(f'expected one report-error catch block, found {source.count(old_catch)}')
          source = source.replace(old_catch, new_catch, 1)

          old_ensure = """  if (!startupState.inFlight) {
            startupState.inFlight = collectRuntimeGraphicsReport(deps).then((report) => {
              if (report) (deps.log ?? defaultLog)('[psyche:graphics]', report);
              return report;
            });
          }

          return startupState.inFlight;
        }
        """
          new_ensure = """  if (!startupState.inFlight) {
            const invoke = deps.invoke ?? defaultInvoke();
            // Tauri installs its global bridge after the module can begin loading.
            // A missing default invoke is therefore retryable and must never be
            // cached as the startup result.
            if (!invoke) return Promise.resolve(null);

            startupState.inFlight = collectRuntimeGraphicsReport({ ...deps, invoke }).then((report) => {
              if (report) safelyLogRuntimeGraphicsReport(deps, report);
              return report;
            });
          }

          return startupState.inFlight;
        }
        """
          if source.count(old_ensure) != 1:
              raise SystemExit(f'expected one startup cache block, found {source.count(old_ensure)}')
          source = source.replace(old_ensure, new_ensure, 1)

          helper_anchor = """function defaultLog(label: '[psyche:graphics]', report: RuntimeGraphicsReport): void {
        """
          helpers = """function safelyReportRuntimeGraphicsError(
          deps: RuntimeGraphicsStartupDependencies,
          error: unknown,
        ): void {
          try {
            (deps.reportError ?? defaultReportError)(error, 'collect runtime graphics report');
          } catch {
            // Diagnostics reporting is best-effort and must never block startup.
          }
        }

        function safelyLogRuntimeGraphicsReport(
          deps: RuntimeGraphicsStartupDependencies,
          report: RuntimeGraphicsReport,
        ): void {
          try {
            (deps.log ?? defaultLog)('[psyche:graphics]', report);
          } catch {
            // Consumer logging is best-effort and must never block startup.
          }
        }

        """
          if source.count(helper_anchor) != 1:
              raise SystemExit(f'expected one defaultLog anchor, found {source.count(helper_anchor)}')
          source = source.replace(helper_anchor, helpers + helper_anchor, 1)
          source_path.write_text(source)

          test_path = Path('__tests__/tauriGraphicsDiagnostics.test.ts')
          tests = test_path.read_text()
          test_anchor = """  it('reports malformed native runtime facts instead of failing silently', async () => {
        """
          additions = """  it('contains failures from consumer-provided error reporters', async () => {
            const startupState = createRuntimeGraphicsStartupState();

            await expect(ensureRuntimeGraphicsStartupSummary({
              invoke: async () => {
                throw new Error('runtime diagnostics unavailable');
              },
              reportError: () => {
                throw new Error('error reporter unavailable');
              },
              navigatorTarget: {},
              createCanvas: () => null,
            }, startupState)).resolves.toBeNull();
          });

          it('contains failures from consumer-provided startup loggers', async () => {
            const startupState = createRuntimeGraphicsStartupState();

            await expect(ensureRuntimeGraphicsStartupSummary({
              invoke: async () => ({
                os: 'macos',
                arch: 'aarch64',
                engine: 'WKWebView',
              }),
              log: () => {
                throw new Error('startup logger unavailable');
              },
              navigatorTarget: {},
              createCanvas: () => null,
            }, startupState)).resolves.toMatchObject({
              os: 'macos',
              arch: 'aarch64',
              engine: 'WKWebView',
              acceleration: 'unavailable',
            });
          });

          it('does not cache a missing default invoke and retries once the bridge is available', async () => {
            const startupState = createRuntimeGraphicsStartupState();
            const globalTarget = globalThis as typeof globalThis & {
              __TAURI__?: {
                core?: {
                  invoke?: (command: string, args?: Record<string, unknown>) => Promise<unknown>;
                };
              };
            };
            const previousDescriptor = Object.getOwnPropertyDescriptor(globalTarget, '__TAURI__');

            try {
              Object.defineProperty(globalTarget, '__TAURI__', {
                configurable: true,
                writable: true,
                value: undefined,
              });

              await expect(ensureRuntimeGraphicsStartupSummary({
                navigatorTarget: {},
                createCanvas: () => null,
              }, startupState)).resolves.toBeNull();
              expect(startupState.inFlight).toBeNull();

              const invoke = vi.fn(async () => ({
                os: 'macos',
                arch: 'aarch64',
                engine: 'WKWebView',
              }));
              globalTarget.__TAURI__ = { core: { invoke } };

              await expect(ensureRuntimeGraphicsStartupSummary({
                navigatorTarget: {},
                createCanvas: () => null,
              }, startupState)).resolves.toMatchObject({
                os: 'macos',
                arch: 'aarch64',
                engine: 'WKWebView',
                acceleration: 'unavailable',
              });
              expect(invoke).toHaveBeenCalledTimes(1);
            } finally {
              if (previousDescriptor) {
                Object.defineProperty(globalTarget, '__TAURI__', previousDescriptor);
              } else {
                delete globalTarget.__TAURI__;
              }
            }
          });

        """
          if tests.count(test_anchor) != 1:
              raise SystemExit(f'expected one malformed-facts test anchor, found {tests.count(test_anchor)}')
          test_path.write_text(tests.replace(test_anchor, additions + test_anchor, 1))
          PY

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Regenerate and verify the runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir native/desktop/psyche-build-tauri build:web
          pnpm vitest --run \
            __tests__/tauriGraphicsDiagnostics.test.ts \
            __tests__/tauriWebBundles.test.ts \
            __tests__/tauriWorkspacePanels.test.ts
          pnpm typecheck
          pnpm run typecheck:tests
          git diff --check

      - name: Commit the reviewed correction and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git rm .github/workflows/fix-graphics-startup-safety.yml
          git add \
            native/desktop/psyche-build-tauri/web/runtime/graphics-diagnostics.ts \
            native/desktop/psyche-build-tauri/web/runtime.bundle.js \
            __tests__/tauriGraphicsDiagnostics.test.ts
          git commit -m "fix(graphics): keep startup diagnostics non-blocking"
          git push origin HEAD:feat/graphics-evidence-diagnostics

# Trigger the one-shot repair after the workflow file exists on this branch.
