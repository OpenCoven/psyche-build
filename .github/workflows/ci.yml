name: CI

on:
  pull_request:
  push:
    branches: [main, feat/gpu-accelerated-ade]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-rust:
    name: TypeScript and Rust
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.14.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.95.0 action @ 2026-03-27
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install tmux
        run: brew install tmux

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript and package surfaces
        run: |
          set -euo pipefail
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm smoke:pack

      - name: Verify Rust and Tauri surfaces
        run: |
          set -euo pipefail
          MANIFEST="native/desktop/psyche-build-tauri/src-tauri/Cargo.toml"
          cargo fmt --manifest-path "$MANIFEST" --check
          cargo test --manifest-path "$MANIFEST" --locked
          cargo check --manifest-path "$MANIFEST" --locked
          pnpm --dir native/desktop/psyche-build-tauri build:web

  desktop-runtime:
    name: Desktop runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.14.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.95.0 action @ 2026-03-27
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform-neutral desktop contracts
        run: pnpm vitest --run __tests__/tauriDesktopPlatform.test.ts __tests__/tauriWebBundles.test.ts __tests__/tauriPackageScripts.test.ts __tests__/tauriDesktopTabs.test.ts

      - name: Build desktop web bundles
        run: pnpm --dir native/desktop/psyche-build-tauri build:web

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path native/desktop/psyche-build-tauri/src-tauri/Cargo.toml --check

      - name: Test desktop runtime
        run: cargo test --manifest-path native/desktop/psyche-build-tauri/src-tauri/Cargo.toml --locked

      - name: Check desktop runtime
        run: cargo check --manifest-path native/desktop/psyche-build-tauri/src-tauri/Cargo.toml --locked

  ios:
    name: iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.14.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C52' "$RUNNER_TEMP/xcode-version.txt"

      - uses: ./.github/actions/setup-xcodegen

      - name: Require iOS 26.2 iPhone 16 Pro simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          if ! jq -e '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | any(.name == "iPhone 16 Pro" and .isAvailable == true)
          ' "$RUNNER_TEMP/available-simulators.json" >/dev/null; then
            echo "::error::iOS 26.2 iPhone 16 Pro simulator is unavailable"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Generate and verify the iOS project
        run: pnpm ios:project:check

      - name: Test Core, build the app, and run app and UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheCore \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-core-derived-data"
          xcodebuild build \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-app-build-derived-data"
          xcodebuild test \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-app-test-derived-data"
