name: CI

on:
  pull_request:
  push:
    branches: [main, feat/gpu-accelerated-ade]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.classify.outputs.desktop }}
      ios: ${{ steps.classify.outputs.ios }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: classify
        name: Classify native validation paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: scripts/classify-ci-changes.sh

  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install tmux
        run: brew install tmux

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript, docs, and package build
        run: |
          set -euo pipefail
          pnpm docs:focus:check
          pnpm --dir docs build
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Verify package installation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm smoke:pack

  desktop-web:
    name: Desktop web
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform-neutral desktop contracts
        run: pnpm vitest --run __tests__/tauriDesktopPlatform.test.ts __tests__/tauriWebBundles.test.ts __tests__/tauriPackageScripts.test.ts __tests__/tauriDesktopTabs.test.ts

      - name: Build desktop web bundles
        run: pnpm --dir native/desktop/psyche-build-tauri build:web

  rust-test:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.95.0 action @ 2026-03-27
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and test desktop Rust
        run: |
          set -euo pipefail
          MANIFEST="native/desktop/psyche-build-tauri/src-tauri/Cargo.toml"
          cargo fmt --manifest-path "$MANIFEST" --check
          cargo test --manifest-path "$MANIFEST" --locked

  desktop-check:
    name: Desktop check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.95.0 action @ 2026-03-27
        with:
          toolchain: 1.95.0

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install \
            --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check desktop runtime
        run: cargo check --manifest-path native/desktop/psyche-build-tauri/src-tauri/Cargo.toml --locked

      - name: Test desktop runtime on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo test --manifest-path native/desktop/psyche-build-tauri/src-tauri/Cargo.toml --locked

  typescript-rust:
    name: TypeScript and Rust
    if: always()
    needs: [changes, quality, desktop-web, rust-test, desktop-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful quality and desktop validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP_REQUIRED: ${{ needs.changes.outputs.desktop }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DESKTOP_WEB_RESULT: ${{ needs['desktop-web'].result }}
          RUST_TEST_RESULT: ${{ needs['rust-test'].result }}
          DESKTOP_CHECK_RESULT: ${{ needs['desktop-check'].result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$DESKTOP_REQUIRED" = true ]; then
            test "$DESKTOP_WEB_RESULT" = success
            test "$RUST_TEST_RESULT" = success
            test "$DESKTOP_CHECK_RESULT" = success
          else
            test "$DESKTOP_WEB_RESULT" = skipped
            test "$RUST_TEST_RESULT" = skipped
            test "$DESKTOP_CHECK_RESULT" = skipped
          fi

  ios-core:
    name: iOS Core
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Require pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          grep -Fx 'Build version 17C52' "$RUNNER_TEMP/xcode-version.txt"

      - uses: ./.github/actions/setup-xcodegen

      - name: Require iOS 26.2 iPhone 16 Pro simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-simulators.json"
          if ! jq -e '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"]
            | any(.name == "iPhone 16 Pro" and .isAvailable == true)
          ' "$RUNNER_TEMP/available-simulators.json" >/dev/null; then
            echo "::error::iOS 26.2 iPhone 16 Pro simulator is unavailable"
            xcrun simctl list devices available
            exit 1
          fi

      - name: Generate and verify the iOS project
        run: pnpm ios:project:check

      - name: Test iOS Core
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheCore \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-core-derived-data"

      - name: Build and test the iOS app on push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-app-build-derived-data"
          xcodebuild test \
            -project native/ios/Psyche.xcodeproj \
            -scheme PsycheApp \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 16 Pro' \
            -derivedDataPath "$RUNNER_TEMP/psyche-app-test-derived-data"

  ios:
    name: iOS
    if: always()
    needs: [changes, ios-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful or intentionally skipped iOS validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IOS_REQUIRED: ${{ needs.changes.outputs.ios }}
          IOS_RESULT: ${{ needs['ios-core'].result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [ "$IOS_REQUIRED" = true ]; then
            test "$IOS_RESULT" = success
          else
            test "$IOS_RESULT" = skipped
          fi
