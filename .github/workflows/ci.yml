name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: graphics-startup-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-graphics-startup:
    if: github.repository == 'OpenCoven/psyche-build' && github.event.pull_request.head.ref == 'feat/graphics-evidence-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: feat/graphics-evidence-diagnostics
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile with current main without carrying temporary CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -ne 1 || "${conflicts[0]}" != ".github/workflows/ci.yml" ]]; then
              printf 'unexpected merge conflicts:\n'
              printf '  %s\n' "${conflicts[@]}"
              exit 1
            fi
            git checkout --theirs .github/workflows/ci.yml
            git add .github/workflows/ci.yml
            git commit --no-edit
          fi

      - name: Apply the two reviewed startup-safety corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          source_path = Path('native/desktop/psyche-build-tauri/web/runtime/graphics-diagnostics.ts')
          source = source_path.read_text()

          source, catch_count = re.subn(
              r"(?m)^  } catch \(error\) \{\n    \(deps\.reportError \?\? defaultReportError\)\(error, 'collect runtime graphics report'\);\n    return null;\n  }$",
              """  } catch (error) {
            safelyReportRuntimeGraphicsError(deps, error);
            return null;
          }""",
              source,
              count=1,
          )
          if catch_count != 1:
              raise SystemExit(f'expected one report-error catch block, found {catch_count}')

          source, ensure_count = re.subn(
              r"(?ms)^  if \(!startupState\.inFlight\) \{\n    startupState\.inFlight = collectRuntimeGraphicsReport\(deps\)\.then\(\(report\) => \{\n      if \(report\) \(deps\.log \?\? defaultLog\)\('\[psyche:graphics\]', report\);\n      return report;\n    \}\);\n  \}\n\n  return startupState\.inFlight;$",
              """  if (!startupState.inFlight) {
            const invoke = deps.invoke ?? defaultInvoke();
            // Tauri installs its global bridge after the module can begin loading.
            // A missing default invoke is retryable and must not be cached.
            if (!invoke) return Promise.resolve(null);

            startupState.inFlight = collectRuntimeGraphicsReport({ ...deps, invoke }).then((report) => {
              if (report) safelyLogRuntimeGraphicsReport(deps, report);
              return report;
            });
          }

          return startupState.inFlight;""",
              source,
              count=1,
          )
          if ensure_count != 1:
              raise SystemExit(f'expected one startup cache block, found {ensure_count}')

          helper_anchor = "function defaultLog(label: '[psyche:graphics]', report: RuntimeGraphicsReport): void {\n"
          helpers = """function safelyReportRuntimeGraphicsError(
            deps: RuntimeGraphicsStartupDependencies,
            error: unknown,
          ): void {
            try {
              (deps.reportError ?? defaultReportError)(error, 'collect runtime graphics report');
            } catch {
              // Diagnostics reporting is best-effort and must never block startup.
            }
          }

          function safelyLogRuntimeGraphicsReport(
            deps: RuntimeGraphicsStartupDependencies,
            report: RuntimeGraphicsReport,
          ): void {
            try {
              (deps.log ?? defaultLog)('[psyche:graphics]', report);
            } catch {
              // Consumer logging is best-effort and must never block startup.
            }
          }

          """
          if source.count(helper_anchor) != 1:
              raise SystemExit(f'expected one defaultLog anchor, found {source.count(helper_anchor)}')
          source_path.write_text(source.replace(helper_anchor, helpers + helper_anchor, 1))

          test_path = Path('__tests__/tauriGraphicsDiagnostics.test.ts')
          tests = test_path.read_text()
          test_anchor = "  it('reports malformed native runtime facts instead of failing silently', async () => {\n"
          additions = """  it('contains failures from consumer-provided error reporters', async () => {
            const startupState = createRuntimeGraphicsStartupState();

            await expect(ensureRuntimeGraphicsStartupSummary({
              invoke: async () => {
                throw new Error('runtime diagnostics unavailable');
              },
              reportError: () => {
                throw new Error('error reporter unavailable');
              },
              navigatorTarget: {},
              createCanvas: () => null,
            }, startupState)).resolves.toBeNull();
          });

          it('contains failures from consumer-provided startup loggers', async () => {
            const startupState = createRuntimeGraphicsStartupState();

            await expect(ensureRuntimeGraphicsStartupSummary({
              invoke: async () => ({
                os: 'macos',
                arch: 'aarch64',
                engine: 'WKWebView',
              }),
              log: () => {
                throw new Error('startup logger unavailable');
              },
              navigatorTarget: {},
              createCanvas: () => null,
            }, startupState)).resolves.toMatchObject({
              os: 'macos',
              arch: 'aarch64',
              engine: 'WKWebView',
              acceleration: 'unavailable',
            });
          });

          it('does not cache a missing default invoke and retries once the bridge is available', async () => {
            const startupState = createRuntimeGraphicsStartupState();
            const globalTarget = globalThis as typeof globalThis & {
              __TAURI__?: {
                core?: {
                  invoke?: (command: string, args?: Record<string, unknown>) => Promise<unknown>;
                };
              };
            };
            const previousDescriptor = Object.getOwnPropertyDescriptor(globalTarget, '__TAURI__');

            try {
              Object.defineProperty(globalTarget, '__TAURI__', {
                configurable: true,
                writable: true,
                value: undefined,
              });

              await expect(ensureRuntimeGraphicsStartupSummary({
                navigatorTarget: {},
                createCanvas: () => null,
              }, startupState)).resolves.toBeNull();
              expect(startupState.inFlight).toBeNull();

              const invoke = vi.fn(async () => ({
                os: 'macos',
                arch: 'aarch64',
                engine: 'WKWebView',
              }));
              globalTarget.__TAURI__ = { core: { invoke } };

              await expect(ensureRuntimeGraphicsStartupSummary({
                navigatorTarget: {},
                createCanvas: () => null,
              }, startupState)).resolves.toMatchObject({
                os: 'macos',
                arch: 'aarch64',
                engine: 'WKWebView',
                acceleration: 'unavailable',
              });
              expect(invoke).toHaveBeenCalledTimes(1);
            } finally {
              if (previousDescriptor) {
                Object.defineProperty(globalTarget, '__TAURI__', previousDescriptor);
              } else {
                delete globalTarget.__TAURI__;
              }
            }
          });

          """
          if tests.count(test_anchor) != 1:
              raise SystemExit(f'expected one malformed-facts test anchor, found {tests.count(test_anchor)}')
          test_path.write_text(tests.replace(test_anchor, additions + test_anchor, 1))
          PY

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install, regenerate, and validate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir native/desktop/psyche-build-tauri build:web
          pnpm vitest --run \
            __tests__/tauriGraphicsDiagnostics.test.ts \
            __tests__/tauriWebBundles.test.ts \
            __tests__/tauriWorkspacePanels.test.ts
          pnpm typecheck
          pnpm run typecheck:tests
          git diff --check

      - name: Commit only the validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/fix-graphics-startup-safety.yml
          git add \
            .github/workflows/ci.yml \
            native/desktop/psyche-build-tauri/web/runtime/graphics-diagnostics.ts \
            native/desktop/psyche-build-tauri/web/runtime.bundle.js \
            __tests__/tauriGraphicsDiagnostics.test.ts
          git diff --cached --check
          git commit -m "fix(graphics): keep startup diagnostics non-blocking"
          git push origin HEAD:feat/graphics-evidence-diagnostics
