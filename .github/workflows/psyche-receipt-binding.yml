name: Offline Psyche receipt binding
on:
  pull_request:
    paths:
      - 'protocol-fixtures/psyche-receipt-binding/**'
      - 'protocol-fixtures/psyche-lifecycle/**'
      - 'src/control/**'
      - 'src/orchestration/**'
      - '.github/workflows/psyche-receipt-binding.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise the exact pin offline
        shell: bash
        run: |
          set -euo pipefail
          bash protocol-fixtures/psyche-receipt-binding/qualify.sh | tee "$RUNNER_TEMP/receipt-binding.ndjson"
      - name: Retain the receipt binding transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: receipt-binding-${{ matrix.os }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/receipt-binding.ndjson
          if-no-files-found: error
